            <li><strong>Ratio:</strong> The split ratio (e.g., 2:1 for a forward split or 1:2 for a reverse split) indicating how shares are multiplied or consolidated.</li>
            <li><strong>Split Type:</strong> Indicates whether the split is forward (increasing share count) or reverse (reducing share count).</li>
