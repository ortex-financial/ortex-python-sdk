        <p>Provides a list of significant macroeconomic events, including key metrics and country-specific information.</p>

        <h3>Available Data Points:</h3>
        <ul>
            <li><strong>Title:</strong> Short descriptive title of the event.</li>
            <li><strong>Date:</strong> The date of the event in `YYYY-MM-DD` format.</li>
            <li><strong>Datetime:</strong> The exact date and time in `YYYY-MM-DDTHH:mm:ssZ` format (ISO 8601), if applicable. </li>
            <li><strong>Actual Value:</strong> Reported or observed value for the event.</li>
            <li><strong>Expectation:</strong> Forecast or expected value for the event.</li>
            <li><strong>Surprise:</strong> Comparison or difference between actual and expected values.</li>
            <li><strong>Previous:</strong> Value reported during the previous reporting period.</li>
            <li><strong>Country iso2:</strong> Two-letter ISO country code (e.g., US, UK, DE).</li>
