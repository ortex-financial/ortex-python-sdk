  /api/v1/stock/{exchange_symbol}/{ticker}/options/chain:
    get:
      operationId: stock_options_chain_list
      description: |2

        <p>API to retrieve the complete option chain for a given ticker and expiry date.</p>

        <h3>Available Data Points:</h3>
        <ul>
            <li><strong>strike_price:</strong> The strike price of the option contract.</li>
            <li><strong>option_type:</strong> Type of option ("call" or "put").</li>
            <li><strong>oi:</strong> Open interest for the option contract.</li>
            <li><strong>volume:</strong> Trading volume for the option contract.</li>
            <li><strong>last_price:</strong> Last traded price of the option.</li>
            <li><strong>last_size:</strong> Size of the last trade.</li>
            <li><strong>ask_price:</strong> Current ask price.</li>
            <li><strong>ask_size:</strong> Current ask size (number of contracts available at ask).</li>
            <li><strong>bid_price:</strong> Current bid price.</li>
            <li><strong>bid_size:</strong> Current bid size (number of contracts available at bid).</li>
            <li><strong>updated_date:</strong> Timestamp of the last update.</li>
        </ul>

        <p><strong>Try it out!</strong> You can test the API with the <strong>trial key</strong> <code>TEST</code>. Simply include it in your request headers; either here, or add the header <code>"Ortex-Api-Key": "TEST"</code> to your http request.</p>


        <p>
        <strong>Trial key restrictions: </strong>A list of randomly selected rows will be returned</p>
        <p><strong>Get full access!</strong> Get a key at <a href="https://app.ortex.com/apis" target="_blank">app.ortex.com/apis</a></p>
      summary: Option Chains
      parameters:
      - in: query
        name: as_of_date
        schema:
          type: string
        description: Format yyyy-mm-dd
      - in: path
        name: exchange_symbol
        schema:
          type: string
        description: Exchange symbol (e.g. "nyse", "nasdaq"), MIC code (e.g. "xnys",
          "xnas") or two character ISO country code (e.g "us", "ca" for ALL country
          exchanges)
        required: true
        examples:
          NewYorkStockExchangeSymbol:
