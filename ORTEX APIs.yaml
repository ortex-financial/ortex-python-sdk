    get:
      operationId: stock_european_short_interest_filings_open_positions_at_list
      description: "\n<p>API to retrieve official short interest positions for a given
        ticker on a given exchange.</p>\n\n<h3>Available Data Points:</h3>\n<ul>\n
        \   <li><strong>Position Start Date:</strong> Date for the short interest
        data. (<code>YYYY-MM-DD</code> format).</li>\n    <li><strong>Position End
        Date:</strong> Date for the short interest data. (<code>YYYY-MM-DD</code>
        format).</li>\n    <li><strong>Holder:</strong> The institution or entity
        holding the short position.</li>\n    <li><strong>Currency:</strong> The currency
        of the position value.</li>\n    <li><strong>Short Interest Percentage:</strong>
        The percentage of shares outstanding shorted.</li>\n    <li><strong>Short
        Interest Percentage Free Float:</strong> The percentage of free float shares
        shorted.</li>\n    <li><strong>Short Interest Value:</strong> Value of the
        position in the <code>currency</code> (shortInterestShares × closing price).</li>\n</ul>\n\n\n\n\n<p>For
