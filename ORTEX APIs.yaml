            <li><code>growth</code> - Overall growth family weight (default: 50)</li>
            <li><code>gross_profit_to_assets_5y_average</code> - 5-Year Average Gross Profit to Assets</li>
            <li><code>eps_12m_fwd_yoy_increase</code> - EPS 12-Month Forward YoY Increase</li>
            <li><code>internal_growth</code> - Internal Growth Rate</li>
            <li><code>cagr_ebit_5y</code> - 5-Year EBIT CAGR</li>
            <li><code>dividend_increase</code> - Dividend Increase</li>
            <li><code>sales_increase_1y</code> - 1-Year Sales Increase</li>
            <li><code>roe_x_earnings_retention</code> - ROE x Earnings Retention</li>
            <li><code>ebit_margin_increase_5y</code> - 5-Year EBIT Margin Increase</li>
            <li><code>roa_5y_average</code> - 5-Year Average ROA</li>
            <li><code>ebit_margin_increase</code> - EBIT Margin Increase</li>
            <li><code>roce_5y_average</code> - 5-Year Average ROCE</li>
            <li><code>croic_5y_average</code> - 5-Year Average CROIC</li>
            <li><code>sales_increase_5y</code> - 5-Year Sales Increase</li>
        </ul>

        <h4>Momentum Metrics (momentum family weight):</h4>
        <ul>
            <li><code>momentum</code> - Overall momentum family weight (default: 65)</li>
            <li><code>analyst_oac_diff</code> - Analyst Opinion vs Actual Difference</li>
            <li><code>current_oac</code> - Current Analyst Opinion</li>
            <li><code>tp_diff</code> - Target Price Difference</li>
            <li><code>eps_momentum_90days</code> - 90-Day EPS Momentum</li>
            <li><code>dma_75_over_300</code> - 75-Day MA over 300-Day MA</li>
            <li><code>relative_strength_91</code> - 91-Day Relative Strength</li>
            <li><code>relative_strength_182</code> - 182-Day Relative Strength</li>
            <li><code>relative_strength_365</code> - 365-Day Relative Strength</li>
            <li><code>high_52w</code> - Distance from 52-Week High</li>
            <li><code>tp_change</code> - Target Price Change</li>
            <li><code>pe_change</code> - P/E Ratio Change</li>
            <li><code>analyst_rec_diff</code> - Analyst Recommendation Difference</li>
            <li><code>eps_momentum_30days</code> - 30-Day EPS Momentum</li>
            <li><code>price_eps_weighted_diverge</code> - Price vs EPS Weighted Divergence</li>
        </ul>

        <h4>Value Metrics:</h4>
        <p>Value metrics are calculated from fundamental valuation ratios and are included in the overall scoring.</p>

        <h3>Default Behavior:</h3>
        <p>When using GET or when weights are not specified in POST, the API uses ORTEX's default weight configuration. When custom weights are provided via POST, any metric not specified defaults to 0, effectively excluding it from the score calculation.</p>

        <p><strong>Disclaimer:</strong> The Stock Score is not an investment recommendation or a guarantee of future returns. It is purely a summary and comparison of selected metrics for informational purposes.</p>


        <p><strong>Try it out!</strong> You can test the API with the <strong>trial key</strong> <code>TEST</code>. Simply include it in your request headers; either here, or add the header <code>"Ortex-Api-Key": "TEST"</code> to your http request.</p>


        <p>
        <strong>Trial key restrictions: </strong>A list of randomly selected rows will be returned</p>
        <p><strong>Get full access!</strong> Get a key at <a href="https://app.ortex.com/apis" target="_blank">app.ortex.com/apis</a></p>
      summary: Stock Scores with Custom Weights
      parameters:
      - in: path
        name: exchange_symbol
        schema:
          type: string
        description: Exchange symbol (e.g. "nyse", "nasdaq"), MIC code (e.g. "xnys",
          "xnas") or two character ISO country code (e.g "us", "ca" for ALL country
          exchanges)
        required: true
        examples:
          NewYorkStockExchangeSymbol:
            value: nyse
