            <li><strong>PCR_vol_current:</strong> Current Put/Call Ratio calculated from traded volume.</li>
            <li><strong>past_date:</strong> Reference date for the past comparison.</li>
            <li><strong>PCR_oi_past:</strong> Put/Call Ratio from open interest on the past date.</li>
            <li><strong>PCR_vol_past:</strong> Put/Call Ratio from traded volume on the past date.</li>
            <li><strong>PCR_oi_week_ago:</strong> Put/Call Ratio from open interest one week ago.</li>
            <li><strong>PCR_vol_week_ago:</strong> Put/Call Ratio from traded volume one week ago.</li>
            <li><strong>PCR_oi_now:</strong> Latest Put/Call Ratio from open interest.</li>
            <li><strong>PCR_vol_now:</strong> Latest Put/Call Ratio from traded volume.</li>
            <li><strong>PCR_oi_yesterday:</strong> Put/Call Ratio from open interest for the previous trading day.</li>
            <li><strong>PCR_vol_yesterday:</strong> Put/Call Ratio from traded volume for the previous trading day.</li>
        </ul>

        <p><strong>Try it out!</strong> You can test the API with the <strong>trial key</strong> <code>TEST</code>. Simply include it in your request headers; either here, or add the header <code>"Ortex-Api-Key": "TEST"</code> to your http request.</p>


