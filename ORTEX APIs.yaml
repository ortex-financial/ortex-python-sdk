  /api/v1/stock/{exchange_symbol}/{ticker}/stock_scores:
    get:
      operationId: stock_stock_scores_list
      description: |2

        <p>This API consolidates data from multiple financial and market sources to produce a set of scores for each stock. By drawing upon both traditional metrics (e.g., valuation ratios, revenue trends) and market-focused indicators (e.g., price momentum, analyst changes), the system delivers an at-a-glance overview that can help users quickly assess a stock's standing across various dimensions. The scores are designed to be used alongside deeper qualitative and quantitative research when evaluating potential investments.</p>

        <h3>HTTP Methods:</h3>
        <ul>
            <li><strong>GET:</strong> Returns stock scores using default weights for all metrics.</li>
            <li><strong>POST:</strong> Allows custom weights to be specified via a JSON body. Missing weights default to 0.</li>
        </ul>

        <h3>Custom Weights (POST only):</h3>
        <p>You can customize the scoring by providing a <code>weights</code> object in the request body. Each weight is a numeric value (typically 0-100) that determines the influence of that metric on the overall score. Metrics not specified in the request will default to 0.</p>

        <p><strong>Example POST body:</strong></p>
        <pre>
        {
          "weights": {
            "quality": 50,
            "growth": 50,
            "momentum": 65,
            "dtc": 100,
            "fcf_assets": 100
          }
        }
        </pre>

        <h3>Output Scores:</h3>
        <ul>
            <li><strong>Quality:</strong> Gauges the financial stability and operational soundness of a company. This includes measures like the Altman Z-Score (for bankruptcy risk), Earnings Variability (consistency of profits), Return on Assets, and Free Cash Flow relative to Sales. A higher Quality score typically indicates stronger metrics relating to financial health and operational efficiency, but it should be considered alongside other factors.</li>
            <li><strong>Momentum:</strong> Measures recent stock price trends and market sentiment. It typically evaluates short-term vs. long-term moving averages (e.g., 50-day vs. 200-day), proximity to 52-week highs, analyst recommendation changes, and earnings surprises. A higher Momentum score can reflect a positive short-term trajectory, though past performance is not indicative of future results.</li>
            <li><strong>Growth:</strong> Examines the company's potential for expansion, including metrics like EBIT CAGR (compound annual growth rate), internal growth rates, and recent sales trends. A higher Growth score generally highlights more positive growth indicators, but these measures should be evaluated within the broader context of market conditions and overall risk tolerance.</li>
            <li><strong>Value:</strong> Focuses on the relationship between a company's fundamentals and its share price. It considers metrics such as Earnings Yield, Price-to-Earnings Ratios, Price-to-Sales Ratios, and other valuation factors (e.g., Enterprise Value/EBIT). A higher Value score generally reflects more favorable valuation metrics in comparison to peers, though it does not assure future performance.</li>
            <li><strong>Total:</strong> The Total score is not merely an average of the four sub-scores. Instead, it incorporates each category's data and compares them to relevant benchmarks, acting more like a percentile rank where 100 is the best. This provides a quick snapshot of where the stock stands relative to the universe of other stocks, based on Value, Quality, Momentum, and Growth characteristics combined.</li>
        </ul>

        <h3>Available Weight Metrics:</h3>
        <p>The following metrics can be customized via the weights parameter. They are grouped by score family:</p>

        <h4>Quality Metrics (quality family weight):</h4>
        <ul>
            <li><code>quality</code> - Overall quality family weight (default: 50)</li>
            <li><code>dtc</code> - Days to Cover</li>
            <li><code>fcf_assets</code> - Free Cash Flow to Assets</li>
            <li><code>f_score</code> - Piotroski F-Score</li>
            <li><code>gross_profit_to_assets</code> - Gross Profit to Assets ratio</li>
            <li><code>earnings_variability</code> - Earnings Variability (consistency)</li>
            <li><code>dtc_change</code> - Days to Cover Change</li>
            <li><code>net_debt_to_equity</code> - Net Debt to Equity ratio</li>
            <li><code>z_last</code> - Altman Z-Score (bankruptcy risk)</li>
            <li><code>margin_stability</code> - Profit Margin Stability</li>
            <li><code>sector_score</code> - Sector-relative Score</li>
            <li><code>short_interest_pc_ff</code> - Short Interest Percentage of Free Float</li>
            <li><code>quality_ml</code> - Machine Learning Quality Score</li>
            <li><code>fcf_sales</code> - Free Cash Flow to Sales</li>
            <li><code>roce</code> - Return on Capital Employed</li>
            <li><code>util</code> - Utilization</li>
            <li><code>roa</code> - Return on Assets</li>
            <li><code>volatility_vs_spy</code> - Volatility vs S&P 500</li>
            <li><code>short_score</code> - Short Interest Score</li>
        </ul>

        <h4>Growth Metrics (growth family weight):</h4>
        <ul>
            <li><code>growth</code> - Overall growth family weight (default: 50)</li>
            <li><code>gross_profit_to_assets_5y_average</code> - 5-Year Average Gross Profit to Assets</li>
            <li><code>eps_12m_fwd_yoy_increase</code> - EPS 12-Month Forward YoY Increase</li>
            <li><code>internal_growth</code> - Internal Growth Rate</li>
            <li><code>cagr_ebit_5y</code> - 5-Year EBIT CAGR</li>
            <li><code>dividend_increase</code> - Dividend Increase</li>
            <li><code>sales_increase_1y</code> - 1-Year Sales Increase</li>
            <li><code>roe_x_earnings_retention</code> - ROE x Earnings Retention</li>
            <li><code>ebit_margin_increase_5y</code> - 5-Year EBIT Margin Increase</li>
            <li><code>roa_5y_average</code> - 5-Year Average ROA</li>
            <li><code>ebit_margin_increase</code> - EBIT Margin Increase</li>
            <li><code>roce_5y_average</code> - 5-Year Average ROCE</li>
            <li><code>croic_5y_average</code> - 5-Year Average CROIC</li>
            <li><code>sales_increase_5y</code> - 5-Year Sales Increase</li>
        </ul>

        <h4>Momentum Metrics (momentum family weight):</h4>
        <ul>
            <li><code>momentum</code> - Overall momentum family weight (default: 65)</li>
            <li><code>analyst_oac_diff</code> - Analyst Opinion vs Actual Difference</li>
            <li><code>current_oac</code> - Current Analyst Opinion</li>
            <li><code>tp_diff</code> - Target Price Difference</li>
            <li><code>eps_momentum_90days</code> - 90-Day EPS Momentum</li>
            <li><code>dma_75_over_300</code> - 75-Day MA over 300-Day MA</li>
            <li><code>relative_strength_91</code> - 91-Day Relative Strength</li>
            <li><code>relative_strength_182</code> - 182-Day Relative Strength</li>
            <li><code>relative_strength_365</code> - 365-Day Relative Strength</li>
            <li><code>high_52w</code> - Distance from 52-Week High</li>
            <li><code>tp_change</code> - Target Price Change</li>
            <li><code>pe_change</code> - P/E Ratio Change</li>
            <li><code>analyst_rec_diff</code> - Analyst Recommendation Difference</li>
            <li><code>eps_momentum_30days</code> - 30-Day EPS Momentum</li>
            <li><code>price_eps_weighted_diverge</code> - Price vs EPS Weighted Divergence</li>
        </ul>

        <h4>Value Metrics:</h4>
        <p>Value metrics are calculated from fundamental valuation ratios and are included in the overall scoring.</p>

        <h3>Default Behavior:</h3>
        <p>When using GET or when weights are not specified in POST, the API uses ORTEX's default weight configuration. When custom weights are provided via POST, any metric not specified defaults to 0, effectively excluding it from the score calculation.</p>

        <p><strong>Disclaimer:</strong> The Stock Score is not an investment recommendation or a guarantee of future returns. It is purely a summary and comparison of selected metrics for informational purposes.</p>


        <p><strong>Try it out!</strong> You can test the API with the <strong>trial key</strong> <code>TEST</code>. Simply include it in your request headers; either here, or add the header <code>"Ortex-Api-Key": "TEST"</code> to your http request.</p>


        <p>
        <strong>Trial key restrictions: </strong>A list of randomly selected rows will be returned</p>
        <p><strong>Get full access!</strong> Get a key at <a href="https://app.ortex.com/apis" target="_blank">app.ortex.com/apis</a></p>
      summary: Stock Scores
      parameters:
      - in: path
        name: exchange_symbol
        schema:
          type: string
        description: Exchange symbol (e.g. "nyse", "nasdaq"), MIC code (e.g. "xnys",
          "xnas") or two character ISO country code (e.g "us", "ca" for ALL country
          exchanges)
        required: true
