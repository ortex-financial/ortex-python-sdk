openapi: 3.0.3
info:
  title: ORTEX APIs
  version: '1.0'
  description: A revolutionary global equity analytics platform which identifies and
    analyses relevant data for your stocks.
paths:
  /api/v1/{exchange_symbol}/{ticker}/short_interest:
    get:
      operationId: short_interest_list
      description: "\n<p>API to retrieve short interest for a given ticker on a given
        exchange</p>\n<p>This API provides the raw number of shares estimated to be
        shorted, \nthe widely used short-interest percentage of free float, the number
        of shares available to trade, \nand the USD value of the estimated short position.\n</p>\n\n\n<h3>Available
        Data Points:</h3>\n<ul>\n    <li><strong>Date:</strong> Date for the short
        interest data. (<code>YYYY-MM-DD</code> format).</li>\n    <li><strong>Short
        Interest Percentage of Free Float:</strong> Short interest estimate as % of
        free float.</li>\n    <li><strong>Short Interest Shares:</strong> Short interest
        estimate in number of shares.</li>\n    <li><strong>Short Interest USD:</strong>
        USD value (shortInterestShares * closing price).</li>\n</ul>\n\n<p><strong>Try
        it out!</strong> You can test the API with the <strong>trial key</strong>
        <code>TEST</code>. Simply include it in your request headers; either here,
        or add the header <code>\"Ortex-Api-Key\": \"TEST\"</code> to your http request.</p>\n\n\n<p>\n<strong>Trial
        key restrictions: </strong>A list of randomly selected rows will be returned</p>\n<p><strong>Get
        full access!</strong> Get a key at <a href=\"https://app.ortex.com/apis\"
        target=\"_blank\">app.ortex.com/apis</a></p>\n"
      summary: Short Interest
      parameters:
      - in: header
        name: accept
        schema:
          type: string
          enum:
          - '*/*'
          - application/json
          - text/csv
          default: '*/*'
      - in: path
        name: exchange_symbol
        schema:
          type: string
        description: Exchange symbol (e.g. "nyse", "nasdaq"), MIC code (e.g. "xnys",
          "xnas") or two character ISO country code (e.g "us", "ca" for ALL country
          exchanges)
        required: true
        examples:
          NewYorkStockExchangeSymbol:
            value: nyse
            summary: New York Stock Exchange symbol
          NASDAQSymbol:
            value: nasdaq
            summary: NASDAQ symbol
          NewYorkStockExchangeMICCode:
            value: xnys
            summary: New York Stock Exchange MIC code
          NASDAQMICCode:
            value: xnas
            summary: NASDAQ MIC code
          AllUSExchanges:
            value: us
            summary: All US exchanges
          AllCanadianExchanges:
            value: ca
            summary: All Canadian exchanges
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
          default: json
        description: Format of the response. Can be "json" or "csv". Default is "json".
      - in: query
        name: from_date
        schema:
          type: string
          format: date
        description: 'Starting date for short interest data (defaults to one month
          ago). Format: YYYY-MM-DD'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: ticker
        schema:
          type: string
        description: Ticker symbol
        required: true
      - in: query
        name: to_date
        schema:
          type: string
          format: date
        description: 'Ending date for short interest data (defaults to today). Format:
          YYYY-MM-DD'
      tags:
      - Short Interest
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedShortInterestEstimatesList'
              examples:
                ShortInterestEstimates:
                  value:
                    paginationLinks:
                      next: http://api.example.org/accounts/?page=4
                      previous: http://api.example.org/accounts/?page=2
                    length: 123
                    rows:
                    - - date: '2023-01-01'
                        shortInterestShares: 100000
                        shortInterestPcFreeFloat: 5.23
                        shortInterestUSD: 2500000
                      - date: '2023-01-02'
                        shortInterestPcFreeFloat: 5.3
                        shortInterestShares: 102000
                        shortInterestUSD: 2550000
                      - date: '2023-01-05'
                        shortInterestPcFreeFloat: 2.3
                        shortInterestShares: 105000
                        shortInterestUSD: 3000000
                  summary: Short Interest Estimates JSON Output
            text/csv:
              schema:
                $ref: '#/components/schemas/PaginatedShortInterestEstimatesList'
          description: ''
        '400':
          description: Invalid request parameters
        '403':
          description: Not authorized
        '404':
          description: Data not found
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/.:
    get:
      operationId: ._retrieve
      description: |-
        Catchall view for malformed URLs.

        Only accepts GET requests. Other HTTP methods will receive a 405 Method Not Allowed response.
        Rate limited to prevent abuse.
        Does not require authentication - returns helpful error for any malformed URL.
      tags:
      - .
      security:
      - ApiKeyAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/earnings:
    get:
      operationId: earnings_list
      description: |2

        <p>Provides upcoming or historic earnings announcements for publicly traded companies, including an optional timestamp when it is available.</p>

        <h3>Available Data Points:</h3>
        <ul>
            <li><strong>Exchange:</strong> The stock exchange where the company is listed (e.g., "Nasdaq", "NYSE").</li>
            <li><strong>Ticker:</strong> The company's stock ticker symbol.</li>
            <li><strong>Date:</strong> Scheduled date of the earnings report (`YYYY-MM-DD` format). </li>
            <li><strong>Datetime:</strong> Exact date and time of the earnings report in `YYYY-MM-DDTHH:mmZ` format, if available.</li>
            <li><strong>Company:</strong> Full name of the company.</li>
            <li><strong>Title:</strong> A human-readable headline of the earnings event.</li>
            <li><strong>Description:</strong> Brief summary or additional details about the earnings event</li>
        </ul>


        <p><strong>Try it out!</strong> You can test the API with the <strong>trial key</strong> <code>TEST</code>. Simply include it in your request headers; either here, or add the header <code>"Ortex-Api-Key": "TEST"</code> to your http request.</p>


        <p>
        <strong>Trial key restrictions: </strong>A list of randomly selected rows will be returned</p>
        <p><strong>Get full access!</strong> Get a key at <a href="https://app.ortex.com/apis" target="_blank">app.ortex.com/apis</a></p>
      summary: List of earning events
      parameters:
      - in: query
        name: from_date
        schema:
          type: string
        description: 'Events from date in format yyyy-mm-dd. Default: one week back
          from today'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: to_date
        schema:
          type: string
        description: 'Events to date in format yyyy-mm-dd. Default: 30 days forward
          from from_date. Maximum date range is 1 month'
      tags:
      - Company Earnings Events
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyEarningsList'
              examples:
                EarningsEvents:
                  value:
                    paginationLinks:
                      next: http://api.example.org/accounts/?page=4
                      previous: http://api.example.org/accounts/?page=2
                    length: 123
                    rows:
                    - - exchange: Nasdaq
                        ticker: NCNO
                        date: '2025-04-01'
                        datetime: 2025-04-01T20:00Z
                        company: nCino, Inc.
                        title: nCino Inc (New) Q4 Earnings 2025
                        description: nCino Inc (New) Q4 Earnings 2025 (After Market)
                      - exchange: NYSE
                        ticker: BB
                        date: '2025-04-02'
                        company: BlackBerry Limited
                        title: BlackBerry Ltd Q4 Earnings 2025
                        description: BlackBerry Ltd Q4 Earnings 2025
                    creditsUsed: 3
                    creditsLeft: 999
                  summary: Earnings Events List
          description: ''
        '400':
          description: Invalid request parameters
        '403':
          description: Not authorized
        '404':
          description: Data not found
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/generics/exchanges:
    get:
      operationId: generics_exchanges_list
      description: |2

        <p>List of all the exchanges with their identifying symbol and MIC code that can be used in other Ortex APIs to identify the exchange</p>

        <h3>Available Data Points:</h3>
        <ul>
            <li><strong>Exchange Name:</strong> The name of the exchange.</li>
            <li><strong>MIC Code:</strong> The Market Identifier Code of the trading exchange as defined by ISO 10383.</li>
            <li><strong>Exchange Symbol:</strong> The symbol that identifies the exchange. </li>
            <li><strong>Country Name:</strong> The country of the exchange.</li>
        </ul>


        <p><strong>Try it out!</strong> You can test the API with the <strong>trial key</strong> <code>TEST</code>. Simply include it in your request headers; either here, or add the header <code>"Ortex-Api-Key": "TEST"</code> to your http request.</p>


        <p>
        <strong>Trial key restrictions: </strong>A list of randomly selected rows will be returned</p>
        <p><strong>Get full access!</strong> Get a key at <a href="https://app.ortex.com/apis" target="_blank">app.ortex.com/apis</a></p>
      summary: Exchanges list
      parameters:
      - in: query
        name: country_name
        schema:
          type: string
        description: Optional filter by country name
        examples:
          Default:AllCountries:
            summary: 'Default: all countries'
          UnitedStates:
            value: United States
            summary: United States
          UnitedKingdom:
            value: United Kingdom
            summary: United Kingdom
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: sort_by
        schema:
          type: string
        description: Optional sort by field
        examples:
          Default:ExchangeName:
            summary: 'Default: exchange_name'
          MicCode:
            value: mic_code
            summary: Mic Code
          ExchangeSymbol:
            value: exchange_symbol
            summary: Exchange Symbol
          CountryName:
            value: country_name
            summary: Country Name
      tags:
      - Exchanges
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExchangesList'
              examples:
                Exchanges:
                  value:
                    paginationLinks:
                      next: http://api.example.org/accounts/?page=4
                      previous: http://api.example.org/accounts/?page=2
                    length: 123
                    rows:
                    - - exchangeName: All US Exchanges
                        micCode: N/A
                        exchangeSymbol: US
                        countryName: United States
                      - exchangeName: Abu Dhabi Securities Exchange
                        micCode: XADS
                        exchangeSymbol: ADX
                        countryName: United Arab Emirates
                      - exchangeName: Aequitas Neo Exchange
                        micCode: NEOE
                        exchangeSymbol: NEOE
                        countryName: Canada
                      - exchangeName: Amman Stock Exchange
                        micCode: XAMM
                        exchangeSymbol: ASE
                        countryName: Jordan
                      - exchangeName: Australian Securities Exchange
                        micCode: XASX
                        exchangeSymbol: ASX
                        countryName: Australia
                    creditsUsed: 3
                    creditsLeft: 999
                  summary: Exchanges list
          description: ''
        '400':
          description: Invalid request parameters
        '403':
          description: Not authorized
        '404':
          description: Data not found
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/index/short_availability:
    get:
      operationId: index_short_availability_list
      description: "\n<p>Unlock a detailed view of short availability. This endpoint
        provides rich and actionable insights into how many shares are available to
        borrow for short selling, helping assess market liquidity and borrowing pressure.
        </p>\n\n<p>\nThis API returns data for multiple stocks in an index for the
        specified date.\n</p>\n\n<h3>Available Data Points:</h3>\n\n<ul>\n    <li><strong>Date:</strong>
        The specific date for which the data is retrieved (<code>YYYY-MM-DD</code>
        format).</li>\n    <li><strong>Operating MIC:</strong> The operating Market
        Identifier Code of the security.</li>\n    <li><strong>Ticker:</strong> The
        ticker symbol associated with the security.</li>\n    <li><strong>Exchange:</strong>
        Symbol of the exchange where the security trades.</li>\n    <li><strong>Company:</strong>
        The name of the company issuing the security.</li>\n    <li><strong>FIGI</strong>
        The Financial Instrument Global Identifier.</li>\n    <li><strong>Share Class
        FIGI:</strong> The Financial Instrument Global Identifier for the share class.</li>\n</ul>
        \   \n\n<ul>\n    <li><strong>Short availability shares:</strong> The estimated
        number of shares available to borrow for short selling, based on market utilization
        and reported availability. </li>    \n    <li><strong>Short availability percentage</strong>
        The availability shares expressed as a percentage of estimated short interest,
        indicating how much of the short demand could be covered by borrowable supply.
        </li>\n</ul>\n\n<p><strong>Try it out!</strong> You can test the API with
        the <strong>trial key</strong> <code>TEST</code>. Simply include it in your
        request headers; either here, or add the header <code>\"Ortex-Api-Key\": \"TEST\"</code>
        to your http request.</p>\n\n\n<p>\n<strong>Trial key restrictions: </strong>A
        list of randomly selected rows will be returned</p>\n<p><strong>Get full access!</strong>
        Get a key at <a href=\"https://app.ortex.com/apis\" target=\"_blank\">app.ortex.com/apis</a></p>\n"
      summary: Short Availability
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: 'Date for shorts data (defaults to last available date). Format:
          YYYY-MM-DD'
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
          default: json
        description: Format of the response. Can be "json" or "csv". Default is "json".
      - in: query
        name: index
        schema:
          type: string
          enum:
          - Europe Top 600
          - UK Top 100
          - US-N 100
          - US-S 500
          default: US-S 500
        description: An index name to list all the stocks from
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Short Interest
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedShortAvailabilityIndexV1APIList'
            text/csv:
              schema:
                $ref: '#/components/schemas/PaginatedShortAvailabilityIndexV1APIList'
          description: ''
        '400':
          description: Invalid request parameters
        '403':
          description: Not authorized
        '404':
          description: Data not found
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/index/short_ctb:
    get:
      operationId: index_short_ctb_list
      description: "\n<p>Unlock a detailed view of the cost to borrow securities.
        This endpoint provides rich and actionable insights into the security lending
        fees associated with short selling and offers you a clear perspective on market
        behavior. </p>\n\n<p>\nThis API returns data for multiple stocks in an index
        for the specified date.\n</p>\n\n<h3>Available Data Points:</h3>\n\n<ul>\n
        \   <li><strong>Date:</strong> The specific date for which the data is retrieved
        (<code>YYYY-MM-DD</code> format).</li>\n    <li><strong>Operating MIC:</strong>
        The operating Market Identifier Code of the security.</li>\n    <li><strong>Ticker:</strong>
        The ticker symbol associated with the security.</li>\n    <li><strong>Exchange:</strong>
        Symbol of the exchange where the security trades.</li>\n    <li><strong>Company:</strong>
        The name of the company issuing the security.</li>\n    <li><strong>FIGI</strong>
        The Financial Instrument Global Identifier.</li>\n    <li><strong>Share Class
        FIGI:</strong> The Financial Instrument Global Identifier for the share class.</li>\n</ul>
        \   \n\n<ul>\n    <li><strong>Cost to borrow all:</strong> The average lending
        fees for all outstanding loans presented as an annual percentage rate.</li>
        \   \n    <li><strong>Cost to borrow new</strong> The average lending fees
        for all new loans taken out in the last trading day presented as an annual
        percentage rate.</li>\n</ul>\n\n<p><strong>Try it out!</strong> You can test
        the API with the <strong>trial key</strong> <code>TEST</code>. Simply include
        it in your request headers; either here, or add the header <code>\"Ortex-Api-Key\":
        \"TEST\"</code> to your http request.</p>\n\n\n<p>\n<strong>Trial key restrictions:
        </strong>A list of randomly selected rows will be returned</p>\n<p><strong>Get
        full access!</strong> Get a key at <a href=\"https://app.ortex.com/apis\"
        target=\"_blank\">app.ortex.com/apis</a></p>\n"
      summary: Cost To Borrow
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: 'Date for shorts data (defaults to last available date). Format:
          YYYY-MM-DD'
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
          default: json
        description: Format of the response. Can be "json" or "csv". Default is "json".
      - in: query
        name: index
        schema:
          type: string
          enum:
          - Europe Top 600
          - UK Top 100
          - US-N 100
          - US-S 500
          default: US-S 500
        description: An index name to list all the stocks from
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Short Interest
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedShortCTBIndexV1APIList'
            text/csv:
              schema:
                $ref: '#/components/schemas/PaginatedShortCTBIndexV1APIList'
          description: ''
        '400':
          description: Invalid request parameters
        '403':
          description: Not authorized
        '404':
          description: Data not found
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/index/short_dtc:
    get:
      operationId: index_short_dtc_list
      description: "\n<p>Access a key metric used to evaluate short interest pressure
        on a security. Days to Cover (DTC) provides an estimate of how many trading
        days it would take, based on average daily volume, for all short positions
        to be covered (i.e., bought back). </p>\n\n<p>\nThis API returns data for
        multiple stocks in an index for the specified date.\n</p>\n\n<h3>Available
        Data Points:</h3>\n\n<ul>\n    <li><strong>Date:</strong> The specific date
        for which the data is retrieved (<code>YYYY-MM-DD</code> format).</li>\n    <li><strong>Operating
        MIC:</strong> The operating Market Identifier Code of the security.</li>\n
        \   <li><strong>Ticker:</strong> The ticker symbol associated with the security.</li>\n
        \   <li><strong>Exchange:</strong> Symbol of the exchange where the security
        trades.</li>\n    <li><strong>Company:</strong> The name of the company issuing
        the security.</li>\n    <li><strong>FIGI</strong> The Financial Instrument
        Global Identifier.</li>\n    <li><strong>Share Class FIGI:</strong> The Financial
        Instrument Global Identifier for the share class.</li>\n</ul>    \n\n<ul>\n
        \   <li><strong>Days to cover:</strong> An estimate of the number of trading
        days it would take to buy back all shares currently sold short, based on average
        daily volume. </li>    \n</ul>\n\n<p><strong>Try it out!</strong> You can
        test the API with the <strong>trial key</strong> <code>TEST</code>. Simply
        include it in your request headers; either here, or add the header <code>\"Ortex-Api-Key\":
        \"TEST\"</code> to your http request.</p>\n\n\n<p>\n<strong>Trial key restrictions:
        </strong>A list of randomly selected rows will be returned</p>\n<p><strong>Get
        full access!</strong> Get a key at <a href=\"https://app.ortex.com/apis\"
        target=\"_blank\">app.ortex.com/apis</a></p>\n"
      summary: Days To Cover / Short Ratio
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: 'Date for shorts data (defaults to last available date). Format:
          YYYY-MM-DD'
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
          default: json
        description: Format of the response. Can be "json" or "csv". Default is "json".
      - in: query
        name: index
        schema:
          type: string
          enum:
          - Europe Top 600
          - UK Top 100
          - US-N 100
          - US-S 500
          default: US-S 500
        description: An index name to list all the stocks from
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Short Interest
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedShortDTCIndexV1APIList'
            text/csv:
              schema:
                $ref: '#/components/schemas/PaginatedShortDTCIndexV1APIList'
          description: ''
        '400':
          description: Invalid request parameters
        '403':
          description: Not authorized
        '404':
          description: Data not found
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/index/short_interest:
    get:
      operationId: index_short_interest_list
      description: "\n<p>Unlock a detailed view of short interest activity for securities
        worldwide. This endpoint provides rich and actionable insights into short
        interest metrics, offering you a clear perspective on market behavior for
        a given day. </p>\n\n<p>\nThis API returns data for multiple stocks in an
        index for the specified date.\n</p>\n\n<h3>Available Data Points:</h3>\n\n<ul>\n
        \   <li><strong>Date:</strong> The specific date for which the data is retrieved
        (<code>YYYY-MM-DD</code> format).</li>\n    <li><strong>Operating MIC:</strong>
        The operating Market Identifier Code of the security.</li>\n    <li><strong>Ticker:</strong>
        The ticker symbol associated with the security.</li>\n    <li><strong>Exchange:</strong>
        Symbol of the exchange where the security trades.</li>\n    <li><strong>Company:</strong>
        The name of the company issuing the security.</li>\n    <li><strong>FIGI</strong>
        The Financial Instrument Global Identifier.</li>\n    <li><strong>Share Class
        FIGI:</strong> The Financial Instrument Global Identifier for the share class.</li>\n</ul>
        \   \n\n<ul>\n    <li><strong>Short Interest Shares:</strong> A precise estimation
        of shares currently shorted.</li>    \n    <li><strong>Percentage of Free
        Float:</strong> The estimated percentage of short interest relative to the
        security's free float.</li>\n    <li><strong>Short Interest Value in USD:</strong>
        Calculated as (<code>shortInterestShares</code> * closing price in USD).</li>\n
        \   <li><strong>Short Score:</strong> ORTEX composite score (0–100) indicating
        relative short-selling pressure.</li>\n</ul>\n\n<p><strong>Try it out!</strong>
        You can test the API with the <strong>trial key</strong> <code>TEST</code>.
        Simply include it in your request headers; either here, or add the header
        <code>\"Ortex-Api-Key\": \"TEST\"</code> to your http request.</p>\n\n\n<p>\n<strong>Trial
        key restrictions: </strong>A list of randomly selected rows will be returned</p>\n<p><strong>Get
        full access!</strong> Get a key at <a href=\"https://app.ortex.com/apis\"
        target=\"_blank\">app.ortex.com/apis</a></p>\n"
      summary: Short Interest
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: 'Date for shorts data (defaults to last available date). Format:
          YYYY-MM-DD'
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
          default: json
        description: Format of the response. Can be "json" or "csv". Default is "json".
      - in: query
        name: index
        schema:
          type: string
          enum:
          - Europe Top 600
          - UK Top 100
          - US-N 100
          - US-S 500
          default: US-S 500
