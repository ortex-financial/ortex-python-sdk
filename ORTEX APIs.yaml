    StockScoresWeightsRequestRequest:
      type: object
      description: |-
        Request body serializer for POST /stock_scores endpoint.

        Allows custom weight configuration for stock score calculation.
        Missing weights will default to 0.
      properties:
        weights:
          type: object
          additionalProperties:
            type: integer
            maximum: 100
            minimum: 0
          description: Dictionary of weight overrides. Keys must be valid metric names,
            values must be integers 0-100. Missing weights default to 0.
    StockSplit:
      type: object
      properties:
        splitDate:
          type: string
          format: date
        ratio:
          type: string
          description: |-
            Calculate ratio from rate for the 'ratio' SerializerMethodField.

            This method is linked to the 'ratio' field in the serializer.
            It computes a string representation of the split ratio based on the rate.

            Args:
                obj (dict): Dictionary object representing the TradingItemSplit data.

            Returns:
                str: The ratio as a string.
          readOnly: true
        splitType:
          type: string
          description: |-
            Determine the split type for the 'split_type' SerializerMethodField.

            This method is linked to the 'split_type' field in the serializer.
            It determines if the split is a reverse split (rate < 1) or forward.

            Args:
                obj (dict): Dictionary object representing the TradingItemSplit data.

            Returns:
                str: 'Reverse' if rate < 1; otherwise 'Forward'.
          readOnly: true
      required:
      - ratio
      - split_date
      - split_type
