        <p><strong>Get full access!</strong> Get a key at <a href="https://app.ortex.com/apis" target="_blank">app.ortex.com/apis</a></p>
      summary: Option PCR Sentiment
      parameters:
      - in: query
        name: days_fwd
        schema:
          type: string
        description: Consider contracts that expire in the following days_fwd days.
