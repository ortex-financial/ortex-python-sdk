  /api/v1/stock/{exchange_symbol}/{ticker}/free_float:
    get:
      operationId: stock_free_float_list
      description: |2

        <p>Identify the true supply of tradable shares with ORTEX’s Free Float API. Perfect for uncovering liquidity constraints, gauging volatility potential, or analyzing a stock’s short interest environment, the Free Float API helps you pinpoint exactly how many shares are available to the public. With consistent and timely updates, it’s an invaluable resource for quant modeling, risk assessment, or portfolio optimization. Integrate ORTEX’s Free Float data directly into your platform to unlock more precise market perspectives and gain a definitive edge.</p>

        <h3>Available Data Points:</h3>
        <ul>
            <li><strong>Date:</strong> Starting date of free float numbers.</li>
            <li><strong>Free Float Shares:</strong> Number of free float shares.</li>
            <li><strong>Free Float Percent Of Outstanding:</strong> Percentage of free float shares from the total outstanding shares.</li>
        </ul>


        <p><strong>Try it out!</strong> You can test the API with the <strong>trial key</strong> <code>TEST</code>. Simply include it in your request headers; either here, or add the header <code>"Ortex-Api-Key": "TEST"</code> to your http request.</p>


        <p>
        <strong>Trial key restrictions: </strong>Data within a specific date range will be returned</p>
        <p><strong>Get full access!</strong> Get a key at <a href="https://app.ortex.com/apis" target="_blank">app.ortex.com/apis</a></p>
      summary: Free Float
      parameters:
      - in: path
        name: exchange_symbol
        schema:
          type: string
        description: Exchange symbol (e.g. "nyse", "nasdaq"), MIC code (e.g. "xnys",
          "xnas") or two character ISO country code (e.g "us", "ca" for ALL country
          exchanges)
        required: true
        examples:
          NewYorkStockExchangeSymbol:
            value: nyse
            summary: New York Stock Exchange symbol
          NASDAQSymbol:
            value: nasdaq
            summary: NASDAQ symbol
          NewYorkStockExchangeMICCode:
            value: xnys
            summary: New York Stock Exchange MIC code
          NASDAQMICCode:
            value: xnas
            summary: NASDAQ MIC code
          AllUSExchanges:
            value: us
            summary: All US exchanges
          AllCanadianExchanges:
            value: ca
            summary: All Canadian exchanges
      - in: query
        name: from_date
        schema:
          type: string
        description: Format yyyy-mm-dd
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: ticker
        schema:
          type: string
        description: Ticker symbol
        required: true
      - in: query
        name: to_date
        schema:
          type: string
        description: Format yyyy-mm-dd. Default is today if not provided
      tags:
      - Free Float
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFreeFloatList'
              examples:
                FreeFloat:
                  value:
                    paginationLinks:
                      next: http://api.example.org/accounts/?page=4
                      previous: http://api.example.org/accounts/?page=2
                    length: 123
                    rows:
                    - - date: '2024-01-01'
