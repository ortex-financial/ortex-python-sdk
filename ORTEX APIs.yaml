  /api/v1/stock/official_short_interest:
    get:
      operationId: stock_official_short_interest_list
      description: "\n<p>Retrieve Official short interest data for US, Canada, Australia
        and Hong Kong for a given stock ticker. \nShort interest is the count of shares
        sold short that remain open (not yet bought back), offering a window into
        positioning and crowd sentiment. Elevated short interest can reflect bearish
        conviction and, in some cases, set the stage for short-squeeze dynamics. </p>\n\n\n<p><strong>Use
        Cases:</strong> Market sentiment analysis, short-squeeze monitoring, risk
        management, trading strategy tuning. </p>\n\n<h3>Available Data Points:</h3>\n<ul>\n
        \   <li><strong>Short Interest:</strong> Total shares reported as short.</li>\n
        \   <li><strong>Days to Cover:</strong> Computed as short_interest ÷ avg_daily_volume,
        estimating how many trading days are needed for shorts to cover. For display
        and risk flags, values below 1 are rounded up to 1. </li>\n    <li><strong>Avg
        Daily Volume:</strong> The stock’s average daily trading volume over a defined
        lookback, used to normalize short interest. </li>\n    <li><strong>Settlement
        Date:</strong> The official reporting/settlement date tied to the exchange
        calendar for this short interest snapshot.</li>\n</ul>\n\n<h3>Coverage:</h3>\n<p>This
        API currently provides officially filed short interest statistics for the
        following countries (country code):</p>\n<ul>\n    <li>United States (US)</li>\n
        \   <li>Australia (AU)</li>\n    <li>Canada (CA)</li>\n    <li>Hong Kong (HK)</li>\n</ul>\n\n"
      summary: Delayed Reported Short Interest
      parameters:
      - in: query
        name: country_code
        schema:
          type: string
        description: '2 character ISO country code: US, CA, AU, HK'
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: settlement_from_date
        schema:
          type: string
        description: Starting settlement date for short interest data (YYYY-MM-DD)
        required: true
      - in: query
        name: settlement_to_date
        schema:
          type: string
        description: Ending settlement date for short interest data (YYYY-MM-DD).
          If no input, will default to settlement_from_date
      - in: query
        name: ticker
        schema:
          type: string
        description: Ticker symbol of company to retrieve short interest for (e.g.
          "AAPL")
        required: true
      tags:
      - Short Interest
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedShortFINRAPositionList'
          description: ''
        '400':
          description: Invalid request parameters
        '403':
          description: Not authorized
        '404':
          description: Data not found
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
  /api/v1/us_government_trades:
    get:
      operationId: us_government_trades_list
      description: "\n<p>This endpoint provides a comprehensive overview of public
        transactions filed by members of the U.S. Government. Each entry offers detailed
        information including company name, exchange, ticker symbol, and the precise
        transaction date. Additionally, the endpoint reveals the individual filer
        (with their party affiliation and congressional chamber), the transaction
        type, the transaction’s USD range, and any committees that the filer belongs
        to. By analyzing these trades, you can gain insights into the trading patterns
        and potential influences within government activities.</p>\n\n<h3>Available
        Data Points:</h3>\n<ul>\n    <li><strong>Company:</strong> The company name
        of the stock. </li>\n    <li><strong>Exchange:</strong> The symbol of the
        exchange where the stock is listed. </li>\n    <li><strong>Ticker:</strong>
        Stock ticker of the company. </li>\n    <li><strong>Transaction date:</strong>
        The date when the transaction was done</li>\n    <li><strong>Report date:</strong>
        The date when the transaction ws reported. </li>\n    <li><strong>USD value:</strong>
        The transaction’s USD value range,</li>\n    <li><strong>Transaction type:</strong>
        The type of transaction (i.e. buy, sell, etc) </li>\n    <li><strong>Filer
        name:</strong> The name of the individual who filed the transaction</li>\n
        \   <li><strong>Party:</strong> The political party affiliation of the filer.
        </li> \n    <li><strong>Chamber:</strong> The congressional chamber where
        the filer is appointed. </li>         \n    <li><strong>Committees:</strong>
        A list of the committees that the filer participates. </li>\n    \n</ul>\n\n<p><strong>Try
        it out!</strong> You can test the API with the <strong>trial key</strong>
        <code>TEST</code>. Simply include it in your request headers; either here,
        or add the header <code>\"Ortex-Api-Key\": \"TEST\"</code> to your http request.</p>\n\n\n<p>\n<strong>Trial
        key restrictions: </strong>A list of randomly selected rows will be returned</p>\n<p><strong>Get
        full access!</strong> Get a key at <a href=\"https://app.ortex.com/apis\"
        target=\"_blank\">app.ortex.com/apis</a></p>\n"
      summary: List of Trades
      parameters:
      - in: query
        name: chamber
        schema:
          type: string
        description: Chamber
        examples:
          NoFilter:
            summary: No filter
          House:
            value: house
          Senate:
            value: senate
      - in: query
        name: exchange
        schema:
          type: string
        description: Exchange symbol
        examples:
          NoFilter:
            summary: No filter
          NYSE:
            value: NYSE
          Nasdaq:
            value: Nasdaq
      - in: query
        name: filerName
        schema:
          type: string
        description: Name of individual who filed
        examples:
          NoFilter:
            summary: No filter
          JohnDoe:
            value: John Doe
            summary: John Doe
      - in: query
        name: from_date
        schema:
          type: string
        description: 'Transaction from date in format yyyy-mm-dd. Default: one year
          back from to_date'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: party
        schema:
          type: string
        description: Political party
        examples:
          NoFilter:
            summary: No filter
          Republican:
            value: republican
          Democrat:
            value: democrat
          Independent:
            value: independent
      - in: query
        name: ticker
        schema:
          type: string
        description: Company ticker
        examples:
          NoFilter:
            summary: No filter
          Apple:
            value: AAPL
      - in: query
        name: to_date
        schema:
          type: string
        description: 'Transaction to date in format yyyy-mm-dd. Default: today. Maximum
          date range is 1 year'
      - in: query
        name: transactionType
        schema:
          type: string
        description: Transation type
        examples:
          NoFilter:
            summary: No filter
          Buy:
            value: buy
          Sell:
            value: sell
          PartialSell:
            value: Sell (Partial)
            summary: Partial Sell
      tags:
      - US Government Trade
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGovTradesList'
              examples:
                GovernmentTrades:
                  value:
                    paginationLinks:
                      next: http://api.example.org/accounts/?page=4
                      previous: http://api.example.org/accounts/?page=2
                    length: 123
                    rows:
                    - - company: Company1 name
                        exchange: NYSE
                        ticker: AYNT
                        transaction_date: '2024-08-23'
                        report_date: '2024-08-23'
                        usd_value: $1000-$15000
                        transaction_type: Buy
                        filer_name: John Doe
                        party: Republican
                        chamber: House
                        committees:
                        - Committee1
                        - Committee2
                      - company: Company2 name
                        exchange: Nasdaq
                        ticker: AAPL
                        transaction_date: '2024-07-20'
                        report_date: '2024-07-31'
                        usd_value: $1000-$15000
                        transaction_type: Sell
                        filer_name: Jane Doe
                        party: Democrat
                        chamber: Senate
                        committees:
                        - Committee3
                        - Committee4
                      - company: Company3 name
                        exchange: NYSE
                        ticker: AMAT
                        transaction_date: '2024-08-23'
                        report_date: '2024-09-23'
                        usd_value: $1000-$15000
                        transaction_type: Sell (Partial)
                        filer_name: John Doe
                        party: Republican
                        chamber: House
                        committees:
                        - Committee1
